name: Daily Bluesky Marketing Post

on:
  schedule:
    # 每天 UTC 02:00 (北京时间 10:00) 自动执行
    - cron: '0 2 * * *'
  workflow_dispatch: # 支持在 GitHub 网页上随时手动点击运行测试

jobs:
  post_to_bluesky:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 允许工作流将更新后的发帖历史 (posted_history.json) 自动提交回仓库

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Auto-Poster
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          HSYL_BASE_URL: "https://www.hsylkitchen.com"
          DRY_RUN: "false"
        run: |
          python bsky_poster.py

      - name: Commit updated history
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_history.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update posted_history.json [skip ci]" && git push)
